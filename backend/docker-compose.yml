version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexus-ai-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexuspassword
      - NEO4J_DATABASE=neo4j
      - CHROMA_PERSIST_DIRECTORY=/workspace/backend/storage/chroma
      - UPLOAD_DIR=/workspace/backend/uploads
      - STORAGE_DIR=/workspace/backend/storage
      - LLM_PROVIDER=rule_based
      - EMBEDDING_PROVIDER=chroma_default
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,*
    volumes:
      - ./uploads:/workspace/backend/uploads
      - ./storage:/workspace/backend/storage
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - nexus-network

  neo4j:
    image: neo4j:5.26-community
    container_name: nexus-ai-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/nexuspassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexus-network

volumes:
  neo4j-data:
  neo4j-logs:

networks:
  nexus-network:
    driver: bridge
